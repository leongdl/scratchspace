specificationVersion: 'jobtemplate-2023-09'
name: ComfyUI-Wan22-S2V-Batch
parameterDefinitions:
- name: Message
  type: STRING
  default: Starting ComfyUI Wan 2.2 S2V batch render
- name: ECR_REGISTRY
  type: STRING
  default: 224071664257.dkr.ecr.us-west-2.amazonaws.com
- name: COMFYUI_REPOSITORY
  type: STRING
  default: sqex2
- name: COMFYUI_TAG
  type: STRING
  default: wans2v
- name: AWS_REGION
  type: STRING
  default: us-west-2
- name: ActivationCode
  type: STRING
  description: >
    SSM hybrid activation code from aws ssm create-activation.
    Generated by the submit script before job submission.
- name: ActivationId
  type: STRING
  description: >
    SSM hybrid activation ID from aws ssm create-activation.
    Generated by the submit script before job submission.
- name: SessionMinutes
  type: INT
  default: 120
  description: How many minutes to keep the SSM session alive after render completes (0 to skip SSM).
- name: COMFYUI_PORT
  type: INT
  default: 8188
  description: Port ComfyUI listens on inside the container.
- name: WorkflowFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: ComfyUI API Workflow JSON
    groupLabel: Workflow
    fileFilters:
    - label: JSON Files
      patterns: ["*.json"]
  default: "./comfy-dag-api.json"
  description: ComfyUI API-format workflow JSON to execute.
- name: InputImage
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Reference Image
    groupLabel: Inputs
    fileFilters:
    - label: Image Files
      patterns: ["*.jpg", "*.jpeg", "*.png"]
  default: "./image.jpg"
  description: Reference image for the S2V workflow.
- name: InputAudio
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Audio File
    groupLabel: Inputs
    fileFilters:
    - label: Audio Files
      patterns: ["*.mp3", "*.wav"]
  default: "./mary-had-a-little-lamb.mp3"
  description: Audio file for the S2V workflow.
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  default: ./output
  description: Directory where rendered output files will be saved.
steps:
- name: RunComfyWorkflow
  script:
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Run}}']
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        #!/bin/bash
        set -e

        echo '{{Param.Message}}'
        echo "=============================================="
        echo "ComfyUI Wan 2.2 S2V Batch Render"
        echo "=============================================="
        echo "User: $(whoami)"
        echo "Dir:  $(pwd)"
        echo "Host: $(hostname)"
        echo "Region: {{Param.AWS_REGION}}"
        echo ""

        # --- Debug: list working directory and job attachments ---
        echo "--- Session working directory ---"
        ls -la "$(pwd)"
        echo ""
        echo "--- Job attachment paths ---"
        echo "WorkflowFile: {{Param.WorkflowFile}}"
        echo "InputImage:   {{Param.InputImage}}"
        echo "InputAudio:   {{Param.InputAudio}}"
        for f in "{{Param.WorkflowFile}}" "{{Param.InputImage}}" "{{Param.InputAudio}}"; do
          if [ -f "$f" ]; then
            echo "  EXISTS: $f ($(stat --printf='%s' "$f") bytes)"
          else
            echo "  MISSING: $f"
          fi
        done
        echo ""

        # ==============================================
        # PHASE 1: Pull and start ComfyUI container
        # ==============================================

        # --- Cleanup orphaned containers ---
        docker stop comfyui-batch 2>/dev/null || true
        docker rm comfyui-batch 2>/dev/null || true
        docker container prune -f

        # --- ECR login & pull ---
        echo "Logging in to ECR..."
        aws ecr get-login-password --region {{Param.AWS_REGION}} \
          | docker login --username AWS --password-stdin {{Param.ECR_REGISTRY}}

        # --- Smart pull: skip if local image digest matches ECR ---
        cat > /tmp/get_digest.py << 'PYEOF'
        import sys, json
        imgs = json.load(sys.stdin)
        if not imgs:
            print('')
        else:
            digests = imgs[0].get('RepoDigests', [''])
            print(digests[0] if digests else '')
        PYEOF

        LOCAL_DIGEST=$(docker inspect \
          {{Param.ECR_REGISTRY}}/{{Param.COMFYUI_REPOSITORY}}:{{Param.COMFYUI_TAG}} 2>/dev/null \
          | python3 /tmp/get_digest.py \
          | grep -oP 'sha256:\w+' || echo "none")
        REMOTE_DIGEST=$(aws ecr describe-images --region {{Param.AWS_REGION}} \
          --repository-name {{Param.COMFYUI_REPOSITORY}} \
          --image-ids imageTag={{Param.COMFYUI_TAG}} \
          --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "unknown")
        rm -f /tmp/get_digest.py

        echo "Local digest:  $LOCAL_DIGEST"
        echo "Remote digest: $REMOTE_DIGEST"
        if [ "$LOCAL_DIGEST" = "$REMOTE_DIGEST" ] && [ "$LOCAL_DIGEST" != "none" ]; then
          echo "Image is current — skipping pull."
        else
          echo "Pulling image..."
          docker pull {{Param.ECR_REGISTRY}}/{{Param.COMFYUI_REPOSITORY}}:{{Param.COMFYUI_TAG}}
        fi

        # --- Prepare working dirs ---
        WORK_DIR="$(pwd)/comfyui-work"
        mkdir -p "$WORK_DIR/input" "$WORK_DIR/output"

        # Copy job attachments into the input staging area
        cp "{{Param.WorkflowFile}}" "$WORK_DIR/workflow.json"
        cp "{{Param.InputImage}}"   "$WORK_DIR/input/"
        cp "{{Param.InputAudio}}"   "$WORK_DIR/input/"

        # Resolve the actual filenames that were uploaded
        IMAGE_BASENAME=$(basename "{{Param.InputImage}}")
        AUDIO_BASENAME=$(basename "{{Param.InputAudio}}")

        # Patch the workflow JSON so LoadImage / LoadAudio nodes reference
        # the actual filenames we copied into /opt/comfyui/input
        echo "Patching workflow with input filenames..."
        cat > /tmp/patch_workflow.py << PYEOF
        import json
        wf = json.load(open('$WORK_DIR/workflow.json'))
        for node in wf.values():
            ct = node.get('class_type','')
            if ct == 'LoadImage':
                node['inputs']['image'] = '$IMAGE_BASENAME'
            elif ct == 'LoadAudio':
                node['inputs']['audio'] = '$AUDIO_BASENAME'
                node['inputs'].pop('audioUI', None)
        json.dump(wf, open('$WORK_DIR/workflow.json','w'), indent=2)
        print('Workflow patched OK')
        PYEOF
        python3 /tmp/patch_workflow.py
        rm -f /tmp/patch_workflow.py

        # --- Start ComfyUI container ---
        chmod -R 777 "$WORK_DIR/input" "$WORK_DIR/output"

        echo "--- Staged work directory ---"
        ls -laR "$WORK_DIR"
        echo ""

        echo "Starting ComfyUI container..."
        CONTAINER_ID=$(docker run -d \
          --runtime=nvidia \
          --gpus all \
          -e NVIDIA_VISIBLE_DEVICES=all \
          -e NVIDIA_DRIVER_CAPABILITIES=compute,utility \
          --network host \
          -v "$WORK_DIR/input:/opt/comfyui/input" \
          -v "$WORK_DIR/output:/opt/comfyui/output" \
          --name comfyui-batch \
          {{Param.ECR_REGISTRY}}/{{Param.COMFYUI_REPOSITORY}}:{{Param.COMFYUI_TAG}})

        echo "Container started: $CONTAINER_ID"

        # --- Wait for ComfyUI to be ready ---
        echo "Waiting for ComfyUI on port {{Param.COMFYUI_PORT}}..."
        READY=false
        for i in $(seq 1 180); do
          if curl -s --max-time 2 http://localhost:{{Param.COMFYUI_PORT}}/ > /dev/null 2>&1; then
            echo "ComfyUI is ready!"
            READY=true
            break
          fi
          if [ $((i % 15)) -eq 0 ]; then
            echo "Still waiting... ($i/180)"
            docker logs comfyui-batch 2>&1 | tail -10
          fi
          sleep 2
        done

        if [ "$READY" != "true" ]; then
          echo "ERROR: ComfyUI failed to start within 360s"
          docker logs comfyui-batch
          docker stop comfyui-batch || true
          docker rm comfyui-batch || true
          exit 1
        fi

        # --- Verify critical nodes loaded ---
        echo "Verifying critical nodes..."
        cat > /tmp/check_node.py << 'PYEOF'
        import sys, json
        node_name = sys.argv[1]
        d = json.load(sys.stdin)
        assert node_name in d
        PYEOF

        for NODE in LoadAudio AudioEncoderLoader AudioEncoderEncode LoadImage; do
          if curl -s http://localhost:{{Param.COMFYUI_PORT}}/api/object_info/$NODE | python3 /tmp/check_node.py "$NODE" 2>/dev/null; then
            echo "  ✓ $NODE"
          else
            echo "  ✗ $NODE MISSING — dumping ComfyUI startup log:"
            docker logs comfyui-batch 2>&1 | tail -50
            rm -f /tmp/check_node.py
            docker stop comfyui-batch || true
            docker rm comfyui-batch || true
            exit 1
          fi
        done
        rm -f /tmp/check_node.py
        echo "All critical nodes verified."

        # ==============================================
        # PHASE 2: Register SSM managed node
        # ==============================================

        echo ""
        echo "Downloading ssm-setup-cli..."
        mkdir -p /tmp/ssm
        SSM_URL="https://amazon-ssm-{{Param.AWS_REGION}}.s3.{{Param.AWS_REGION}}.amazonaws.com/latest/linux_amd64/ssm-setup-cli"
        curl -sS "$SSM_URL" -o /tmp/ssm/ssm-setup-cli
        sudo chmod +x /tmp/ssm/ssm-setup-cli
        echo "ssm-setup-cli downloaded OK"

        sudo mkdir -p /root/.gnupg
        sudo chmod 700 /root/.gnupg

        echo ""
        echo "Registering with SSM..."
        sudo /tmp/ssm/ssm-setup-cli \
          -register \
          -activation-code "{{Param.ActivationCode}}" \
          -activation-id "{{Param.ActivationId}}" \
          -region "{{Param.AWS_REGION}}" \
        || {
          echo "WARNING: Registration with signature validation failed, retrying with -skip-signature-validation..."
          sudo /tmp/ssm/ssm-setup-cli \
            -register \
            -activation-code "{{Param.ActivationCode}}" \
            -activation-id "{{Param.ActivationId}}" \
            -region "{{Param.AWS_REGION}}" \
            -skip-signature-validation
        }
        echo "Registration complete."

        # --- Extract managed node ID ---
        cat > /tmp/get_node_id.py << 'PYEOF'
        import json, sys
        data = json.load(sys.stdin)
        print(data["ManagedInstanceID"])
        PYEOF

        MANAGED_NODE_ID=$(sudo cat /var/lib/amazon/ssm/registration | python3 /tmp/get_node_id.py)
        rm -f /tmp/get_node_id.py

        echo ""
        echo "=============================================="
        echo "  SSM Managed Node ID: $MANAGED_NODE_ID"
        echo ""
        echo "  Connect with port forwarding:"
        echo ""
        echo "    aws ssm start-session --target $MANAGED_NODE_ID --region {{Param.AWS_REGION}} \\"
        echo "      --document-name AWS-StartPortForwardingSession \\"
        echo "      --parameters '{\"portNumber\":[\"{{Param.COMFYUI_PORT}}\"],\"localPortNumber\":[\"{{Param.COMFYUI_PORT}}\"]}'"
        echo ""
        echo "  Or interactive shell:"
        echo ""
        echo "    aws ssm start-session --target $MANAGED_NODE_ID --region {{Param.AWS_REGION}}"
        echo ""
        echo "=============================================="
        echo ""

        # ==============================================
        # PHASE 3: Submit workflow and render
        # ==============================================

        echo "Submitting workflow to ComfyUI API..."
        cat > /tmp/make_prompt.py << 'PYEOF'
        import json, sys
        wf = json.load(open(sys.argv[1]))
        print(json.dumps({'prompt': wf}))
        PYEOF

        PROMPT_PAYLOAD=$(python3 /tmp/make_prompt.py "$WORK_DIR/workflow.json")
        rm -f /tmp/make_prompt.py

        RESPONSE=$(curl -s -X POST http://localhost:{{Param.COMFYUI_PORT}}/api/prompt \
          -H "Content-Type: application/json" \
          -d "$PROMPT_PAYLOAD")

        cat > /tmp/get_prompt_id.py << 'PYEOF'
        import sys, json
        print(json.load(sys.stdin).get('prompt_id', ''))
        PYEOF

        PROMPT_ID=$(echo "$RESPONSE" | python3 /tmp/get_prompt_id.py)
        rm -f /tmp/get_prompt_id.py

        if [ -z "$PROMPT_ID" ]; then
          echo "ERROR: Failed to queue workflow"
          echo "Response: $RESPONSE"
          docker stop comfyui-batch || true
          docker rm comfyui-batch || true
          exit 1
        fi

        echo "Workflow queued — prompt_id: $PROMPT_ID"

        # --- Poll for completion ---
        echo "Waiting for render to complete..."
        cat > /tmp/check_status.py << 'PYEOF'
        import sys, json
        prompt_id = sys.argv[1]
        h = json.load(sys.stdin)
        if prompt_id in h:
            s = h[prompt_id].get('status', {})
            if s.get('completed', False):
                print('done')
            elif s.get('status_str') == 'error':
                print('error')
            else:
                print('running')
        else:
            print('pending')
        PYEOF

        while true; do
          HISTORY=$(curl -s http://localhost:{{Param.COMFYUI_PORT}}/api/history/$PROMPT_ID)
          STATUS=$(echo "$HISTORY" | python3 /tmp/check_status.py "$PROMPT_ID" 2>/dev/null)

          if [ "$STATUS" = "done" ]; then
            echo "Render complete!"
            break
          elif [ "$STATUS" = "error" ]; then
            echo "ERROR: Workflow execution failed"
            echo "$HISTORY" | python3 -m json.tool 2>/dev/null || echo "$HISTORY"
            rm -f /tmp/check_status.py
            docker stop comfyui-batch || true
            docker rm comfyui-batch || true
            exit 1
          fi

          # Show GPU stats periodically
          nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null \
            | awk -F', ' '{printf "  GPU: %s%% | VRAM: %sMiB/%sMiB\n", $1, $2, $3}' || true
          sleep 10
        done
        rm -f /tmp/check_status.py

        # --- Collect output ---
        echo "Collecting output files..."
        OUTPUT_COUNT=$(find "$WORK_DIR/output" -type f | wc -l)
        echo "Found $OUTPUT_COUNT output file(s)"
        ls -lhR "$WORK_DIR/output/"

        OUTPUT_DIR="{{Param.OutputDir}}"
        mkdir -p "$OUTPUT_DIR"
        cp -r "$WORK_DIR/output/"* "$OUTPUT_DIR/" 2>/dev/null || true
        echo "--- Output directory contents ---"
        ls -lhR "$OUTPUT_DIR"

        # ==============================================
        # PHASE 4: Post-render SSM session (optional)
        # ==============================================

        if [ "{{Param.SessionMinutes}}" -gt 0 ] 2>/dev/null; then
          echo ""
          echo "=============================================="
          echo "  Render done. Keeping SSM session alive for {{Param.SessionMinutes}} minutes."
          echo "  Connect to inspect output or debug:"
          echo ""
          echo "    aws ssm start-session --target $MANAGED_NODE_ID --region {{Param.AWS_REGION}}"
          echo ""
          echo "=============================================="
          echo ""

          TOTAL_SECONDS=$(({{Param.SessionMinutes}} * 60))
          ELAPSED=0
          INTERVAL=60
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))

            if ! docker ps | grep -q comfyui-batch; then
              echo "WARNING: ComfyUI container stopped unexpectedly!"
              docker logs comfyui-batch 2>&1 | tail -20
            fi

            if ! sudo systemctl is-active --quiet amazon-ssm-agent 2>/dev/null; then
              echo "WARNING: amazon-ssm-agent is not running, attempting restart..."
              sudo systemctl start amazon-ssm-agent 2>/dev/null || true
            fi

            GPU_STATS=$(nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null \
              | awk -F', ' '{printf "GPU: %s%% | VRAM: %sMiB/%sMiB", $1, $2, $3}' || echo "GPU: N/A")
            echo "[$(date)] SSM=$MANAGED_NODE_ID | ${GPU_STATS} | ${REMAINING}m remaining"
          done
        fi

        # ==============================================
        # PHASE 5: Cleanup
        # ==============================================

        echo ""
        echo "Cleaning up..."
        docker stop comfyui-batch || true
        docker rm comfyui-batch || true
        docker container prune -f

        echo "Deregistering SSM managed node..."
        sudo amazon-ssm-agent -register -clear 2>/dev/null || true
        sudo systemctl stop amazon-ssm-agent 2>/dev/null || true
        rm -f /tmp/ssm/ssm-setup-cli

        echo "=============================================="
        echo "Job complete. Output files in {{Param.OutputDir}}"
        echo "=============================================="
